# The hosted query tier's nginx limits (D-084). Applied by hand on `plex`,
# because the deploy is an unprivileged rsync of dist/ (D-003) and this is
# root's file. Companion to nginx-chat.conf, and installed the same way
# (`scripts/deploy-sql-nginx.sh`).
#
# What is being bounded: `api/sql.php` runs one caller-supplied read-only
# statement per request against the hosted SQLite copy. The endpoint's own
# guards (authorizer, heap limit, CPU deadline) bound what one request can
# cost — worst case ~one core for ~6 s. What nginx bounds is how many of
# those a caller can have, which the app cannot do for itself:
#
#   limit_req   the rate — how many statements per visitor per minute.
#   limit_conn  concurrency, twice: per visitor, and *globally* — the second
#               zone keys on $server_name, which is constant, so it is one
#               shared counter: at most N statements executing for everyone.
#               That cap is the box's worst-case CPU spend whatever the
#               source distribution of the load.
#
# **These zones key on the visitor, which behind Cloudflare requires the
# real_ip configuration installed by nginx-chat.conf's zones file
# (set_real_ip_from + real_ip_header CF-Connecting-IP, RE-031).** It is
# deliberately not repeated here: one copy, one place to refresh the ranges.
# Do not install this file on an origin that does not have that one.
#
# Rate sizing: a workspace page load issues a handful of statements (the
# hosted probe's two, a report and its count), and an engaged user editing
# filters issues a few per interaction. 300r/m with burst=60 lets a busy
# human never see a 429 while capping a script at five statements a second
# sustained — each of which still pays the endpoint's own deadline. 1m of
# zone state holds ~16,000 addresses.
#
# ===========================================================================
# HOW TO APPLY  (as root on plex — deploy-sql-nginx.sh does 1 and 3)
# ===========================================================================
#
#   1. Split this file into the two pieces below:
#
#        /etc/nginx/conf.d/cve-sql-zones.conf   (nginx.conf includes conf.d/*)
#        /etc/nginx/cve-sql.conf                (included by the server block)
#
#   2. Add ONE line to the `cve.meenan.dev` server block in
#      /etc/nginx/sites-available/meenan.dev, immediately BEFORE
#      `include php.conf;` (beside the existing `include cve-chat.conf;`):
#
#        include cve-sql.conf;
#
#   3. `nginx -t && systemctl reload nginx`
#
# ===========================================================================
# PIECE 1 — /etc/nginx/conf.d/cve-sql-zones.conf
# ---------------------------------------------------------------------------
# Zones are per-`http` and cannot be declared inside a location. The visitor
# resolution these key on lives in cve-sql-zones.conf's *sibling*,
# cve-chat-zones.conf (see above).
# ===========================================================================

limit_req_zone  $binary_remote_addr zone=cve_sql_req:1m  rate=300r/m;
limit_conn_zone $binary_remote_addr zone=cve_sql_conn:1m;
# One constant key = one global counter: the whole-origin concurrency cap.
limit_conn_zone $server_name zone=cve_sql_global:1m;

# ===========================================================================
# PIECE 2 — /etc/nginx/cve-sql.conf
# ===========================================================================

location = /api/sql.php {
    limit_req  zone=cve_sql_req burst=60 nodelay;
    # Per visitor: a page fires a few statements at once; four in flight is a
    # workspace, forty is a scraper.
    limit_conn cve_sql_conn 4;
    # Global: the most caller CPU this endpoint can consume at once, whoever
    # is asking. Six × the endpoint's ~6 s worst case is the box's ceiling.
    limit_conn cve_sql_global 6;
    # The endpoint refuses a body over 256 KB, but PHP only gets to refuse it
    # after nginx has accepted it, and the server-wide default is 500m (set
    # for uploads elsewhere on this box) — the chat location has the same
    # line for the same reason.
    client_max_body_size 512k;
    # 429 rather than nginx's default 503: the caller is a browser on our own
    # page and the difference is actionable — "slow down" versus "we are
    # down". lib/remote.ts renders each accordingly.
    limit_req_status  429;
    limit_conn_status 429;

    # Never cached, anywhere. Same posture as the chat relay.
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Deliberately no Access-Control-Allow-Origin (D-034): same-origin on
    # this origin is the absence of CORS headers, and adding one here is what
    # would make the tier queryable from someone else's page.

    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_index index.php;
    # No `fastcgi_read_timeout` — fastcgi.conf already sets it and nginx
    # refuses a duplicate (the lesson the chat location's comment records).
    # PHP ends a runaway statement itself, far inside that window.
    include fastcgi.conf;
}
