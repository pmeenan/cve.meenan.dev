# The chat relay's nginx limits (M7, D-057). Applied by hand on `plex`, because
# the deploy is an unprivileged rsync of dist/ (D-003) and this is root's file.
#
# These are a **ship requirement, not a nicety**. Same-origin on this origin is
# the absence of CORS headers (D-034), and that stops a cross-site *browser* —
# it does nothing about curl. An unauthenticated relay to free inference on a
# box with one small GPU is an attractive target, so the thing that actually
# bounds abuse is here.
#
# Two halves, and both are needed for different attacks:
#
#   limit_req  bounds the *rate* — how many generations can be started.
#   limit_conn bounds *concurrency* — how many can be in flight at once. A chat
#              completion is a long-lived streaming response, so a caller can
#              hold the GPU with very few requests per second; a rate limit
#              alone would let ten connections sit there generating forever.
#
# ===========================================================================
# HOW TO APPLY  (three steps, as root on plex)
# ===========================================================================
#
#   1. Split this file into the two pieces below — the `http`-level zones and
#      the location block — and put them where nginx will read them:
#
#        /etc/nginx/conf.d/cve-chat-zones.conf   (nginx.conf includes conf.d/*)
#        /etc/nginx/cve-chat.conf                (included by the server block)
#
#      `scripts/deploy-chat-nginx.sh` does exactly this from a copy staged in
#      ~/ on the server, and prints what it is about to do first.
#
#   2. Add ONE line to the `cve.meenan.dev` server block in
#      /etc/nginx/sites-available/meenan.dev, immediately BEFORE
#      `include php.conf;`:
#
#        include cve-chat.conf;
#
#      Order matters: nginx picks the first matching regex location in the
#      order they are defined, and php.conf's `~ [^/]\.php(/|$)` would
#      otherwise take this URL. An exact-match `location =` outranks any
#      regex, so in fact it wins either way — putting it first keeps that from
#      depending on a rule nobody remembers.
#
#   3. `nginx -t && systemctl reload nginx`
#
# ===========================================================================
# PIECE 1 — /etc/nginx/conf.d/cve-chat-zones.conf
# ---------------------------------------------------------------------------
# Zones are per-`http` and cannot be declared inside a location.
#
# **Keyed on the visitor, which behind Cloudflare takes `real_ip` to arrange.**
# Without it `$binary_remote_addr` is a *Cloudflare edge address*, and a limit
# on that is wrong in both directions at once: an attacker arrives over many
# edge IPs and is barely limited, while two ordinary visitors sharing one edge
# contend for the same allowance — with `limit_conn 2` a third simultaneous
# user is a 429 for no reason. Reading the config never showed this; ten
# requests through the edge all returning 200 while five straight to the origin
# returned `200 200 200 200 200 429` did (RE-031).
#
# `real_ip_header CF-Connecting-IP` is trusted **only from Cloudflare's own
# ranges**, which is what makes the header non-forgeable: a caller who finds
# the origin address and sends their own `CF-Connecting-IP` is not in the list,
# so their peer address is used. Stale entries fail in the harmless direction —
# an address that has dropped off the list is simply not trusted.
#
# This also makes `$remote_addr` the visitor in the **access log**, which is a
# deliberate choice and not a side effect: D-079 narrowed the privacy claim to
# the thing that is structurally true — the corpus and every query over it run
# in the browser, and the server never sees a query — and dropped the blanket
# "nothing is recorded" that an origin serving files could not really offer.
#
# The list below is from cloudflare.com/ips-v4 and ips-v6, fetched 2026-08-08.
# Refresh it when Cloudflare publishes changes.
#
# **120r/m with burst=20, raised from 12r/m on 2026-08-09.** The original was
# sized to bound "free LLM" abuse, and that concern is now handled where it
# belongs — the relay pins the system prompt and the tool definitions
# server-side, so the endpoint can only run CVE analysis against our schema and
# is close to worthless as a general assistant. What is left to protect is GPU
# time, and 12r/m was actively hostile to real use: one chat *answer* can take
# two to four model turns, so an engaged user asking a few questions in a minute
# could hit their own limit mid-conversation and see a 429.
#
# The real backstop is not this number. The GPU serialises into two slots and a
# realistic thinking turn is ~4.7 s, so the box tops out near 0.32 req/s
# whatever nginx admits; the limit exists to stop one caller monopolising that
# queue, not to ration it finely. 1m of zone state holds ~16,000 addresses.
# ===========================================================================

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

limit_req_zone  $binary_remote_addr zone=cve_chat_req:1m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=cve_chat_conn:1m;

# ===========================================================================
# PIECE 2 — /etc/nginx/cve-chat.conf
# ===========================================================================

location = /api/chat.php {
    # Per visitor — `$binary_remote_addr` is the real client, because `real_ip`
    # above resolved it from `CF-Connecting-IP` (D-079).
    limit_req  zone=cve_chat_req burst=20 nodelay;
    limit_conn cve_chat_conn 2;
    # The relay refuses a body over 256 KB — but PHP only gets to refuse it
    # after nginx has accepted it, and the server-wide default here is 500m
    # (set for uploads elsewhere on this box). Without this line a caller can
    # make the server buffer half a gigabyte to disk per request before the
    # app says no, which is a denial of service that never reaches the app's
    # own check.
    client_max_body_size 512k;
    # 429 rather than nginx's default 503: the caller is a browser on our own
    # page and the difference is actionable — "slow down" versus "we are down".
    limit_req_status  429;
    limit_conn_status 429;

    # The measured streaming path (D-057's experiment, 2026-08-08). The app
    # also sends `X-Accel-Buffering: no`, which does this per-response; saying
    # it here too means a future PHP change cannot silently reintroduce
    # buffering. Without either, time to first token is 0.62 s instead of 0.47.
    fastcgi_buffering off;
    gzip off;

    # Never cached, anywhere. Cloudflare already reports cf-cache-status:
    # DYNAMIC for it, and this is what keeps that true if a page rule changes.
    add_header Cache-Control "no-store" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Deliberately no Access-Control-Allow-Origin. Same-origin is the absence
    # of CORS headers on this origin (D-034); adding one here is what would
    # make the relay usable from someone else's page.

    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_index index.php;
    # **No `fastcgi_read_timeout` here.** `fastcgi.conf` already sets it (3600 s
    # on this server) and nginx refuses a duplicate in the same context
    # whichever order they appear in — `nginx -t` fails with
    # `"fastcgi_read_timeout" directive is duplicate`, which is how this was
    # found. Redundant as well as duplicate: PHP caps the upstream call at
    # 180 s itself, so the app ends a slow generation with a readable message
    # long before nginx would produce a 504.
    include fastcgi.conf;
}

# ===========================================================================
# OPTIONAL — the missing half of the CSP claim
# ---------------------------------------------------------------------------
# app/layout.tsx pins `connect-src 'self'` with a meta tag, which is what an
# unprivileged rsync can deploy. A meta CSP binds the *document* only — the
# database Worker is served without one and therefore has no policy. Chat runs
# on the main thread, so the M7 claim holds where it is made, but the complete
# version is a response header at the server level:
#
#   add_header Content-Security-Policy "connect-src 'self'" always;
#
# Put it in the `cve.meenan.dev` server block rather than in this file, so it
# covers the document, the Worker script and everything else. It is left out
# here because it changes how every response on the origin behaves, which is a
# bigger decision than the chat endpoint's own limits.
# ===========================================================================
